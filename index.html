    <script>
      // Переезд с HashRouter: старые адреса /#/catalog/xxx уводим на /catalog/xxx.
      // Выполняется до загрузки бандла, поэтому пользователь не видит промежуточный экран.
      (function () {
        var h = window.location.hash;
        if (h.length > 2 && h.charAt(1) === "/") {
          var path = h.slice(1);
          if (path.indexOf("?") === -1) path += window.location.search;
          window.location.replace(path);
        }
      })();
    </script>
