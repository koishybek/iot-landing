# ВНИМАНИЕ: сайт обслуживается Vercel, а не Netlify.
# Проверено по заголовкам ответа: Server: Vercel, X-Vercel-Id.
# Этот файл ни на что не влияет — правила редиректов лежат в vercel.json.
# Оставлен на случай, если Netlify используется как запасная площадка;
# если нет — файл можно удалить.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--no-audit --no-fund --prefer-offline"

# SPA: отдаём index.html на любой маршрут, чтобы BrowserRouter отработал на прямом заходе.
# Должно идти последним — конкретные правила выше имеют приоритет.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
